<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      'unsafe-eval' é necessário pro js-dos (DOOM easter egg) — wdosbox.js
      é Emscripten compilado e usa Function() construtor em runtime.
      Aceitável aqui pois: (a) BrowserWindow já tem nodeIntegration:false +
      contextIsolation:true + sandbox:true; (b) o renderer só carrega HTML
      local que controlamos. CSP é defesa adicional, não única barreira.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: blob:; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: data:;"
    />
    <title>MakeStudio Code</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
